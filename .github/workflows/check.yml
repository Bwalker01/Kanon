# Kanon pull request check (ADR-007, ADR-015): tests and kanon verify, no model calls.
# Skipped on drafts. A failing check returns the pull request to draft.
name: check

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]  # not on push (ADR-015)

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # kanon verify reads the full commit history (K-52)
          persist-credentials: false  # uv sync runs package build code; keep the token out of .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run kanon verify

  to-draft-on-failure:
    needs: check
    if: ${{ failure() && github.event.pull_request.head.repo.full_name == github.repository }}  # fork tokens are read-only
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - run: gh pr ready --undo "$PR" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

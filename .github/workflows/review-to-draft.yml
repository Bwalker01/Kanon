# ADR-011: a human review that is not an approval returns the pull request to draft.
name: review-to-draft

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  to-draft:
    if: >-
      ${{ github.event.review.user.type != 'Bot'
          && github.event.review.state != 'approved'
          && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - run: gh pr ready --undo "$PR" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

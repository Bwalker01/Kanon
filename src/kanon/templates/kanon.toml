# Kanon settings. See kanon/docs/conduct-and-writing.md for how profiles are used.

[kanon]
format = 1
review_round_limit = 3

# One table per person. level is one of:
# new-to-software, some-experience, developer, specialist (empty until asked).
[people.$person_id]
name = "$person_name"
level = "$person_level"
description = "$person_description"
approver = "$approver"
